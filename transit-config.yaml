# TransitPulse - Public Transit Feed & GPS Telemetry Configuration
# Specification: GTFS-Realtime v2.0 / AIS-140 GPS Compliance

agency:
  name: 'Ministry of Transport & Public Transit'
  code: 'STATE-DTC-MTC'
  timezone: 'Asia/Kolkata'
  contact_hotline: '1800-11-8181'
  police_sos: '112'
  women_helpline: '1091'

telemetry:
  refresh_interval_seconds: 1.5
  gps_accuracy_threshold_meters: 10
  minimum_satellite_lock: 8
  jitter_smoothing: true
  dwell_time_at_stops_seconds: 18

fare_rules:
  base_fare_inr: 10
  cost_per_km_inr: 1.8
  concessions:
    student_discount_percentage: 50
    senior_discount_percentage: 40
    daily_unlimited_pass_inr: 50

fleet:
  electric_ev_target_percentage: 80
  low_floor_accessible_required: true
  emergency_panic_system: 'AIS-140'
  cctv_ip_cameras_per_coach: 3
