# Google Cloud App Engine / Cloud Run Deployment Configuration
# TransitPulse - Live Govt Bus Tracker

runtime: nodejs20
env: standard
instance_class: F1

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 10

env_variables:
  NODE_ENV: 'production'
  PORT: '8080'
  APP_NAME: 'TransitPulse - Live Govt Bus Tracker'
  TRANSIT_AGENCY: 'State Ministry of Public Transport'
  GPS_TELEMETRY_REFRESH_RATE: '1.5s'

handlers:
  # Serve static assets with caching headers
  - url: /assets
    static_dir: dist/assets
    secure: always
    expiration: '30d'

  # Serve favicon, icons and manifest
  - url: /(.*\.(ico|png|jpg|svg|json|webmanifest))$
    static_files: dist/\1
    upload: dist/.*\.(ico|png|jpg|svg|json|webmanifest)$
    secure: always

  # Single Page Application routing (serve index.html for all other routes)
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    secure: always
